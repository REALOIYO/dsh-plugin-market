name: Refresh market index

on:
  schedule:
    # 每 6 小时一次（UTC 0/6/12/18，即北京时间 8/14/20/2 点）。
    # GitHub 的 schedule 会排队延迟 1–2 小时，6 小时窗口仍能保持在 4–10 小时间隔。
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator
        run: npm install --no-audit --no-fund

      # 缓存上次抓到的 packument 摘要，让每次只抓新增/变更的包。
      #
      # key 必须是固定值：带 run_id 的 key 每次运行都不同，精确匹配永不命中，
      # 只能靠 restore-keys 捡旧缓存，同时每次都新建一份永久缓存 —— 缓存条目
      # 会无限累积（9.5 MB/次），最终把仓库的 10 GB 配额填满并触发热淘汰。
      # 固定 key 让每次运行复用同一份（约 9.5 MB），只做覆盖更新。
      #
      # 提升 CACHE_VERSION 可在抓取逻辑变化时主动作废旧缓存。
      - name: Restore packument cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: packuments-v2
          restore-keys: |
            packuments-

      # 社区目录用于补充 star 数；下载失败不阻断构建
      - name: Download community catalog
        continue-on-error: true
        run: curl -sS --max-time 120 --retry 3 -o dshso.json https://www.dsh.so/plugins-index.json

      - name: Discover and fetch packages
        run: node build-index.mjs

      # 从社区目录取初版指标（含 scoped 包下载量）
      - name: Collect metrics from community catalog
        continue-on-error: true
        run: |
          if [ -f dshso.json ]; then
            node collect-metrics.mjs dshso.json index.json
          else
            echo "没有社区目录，跳过初版指标采集"
          fi

      # 用 GitHub API 补社区目录覆盖不到的星数。
      # GITHUB_TOKEN 是 Actions 内置的，无需创建 secret；未认证时限额只有 60 次/小时。
      - name: Backfill stars from GitHub API
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f metrics.json ] || echo '{}' > metrics.json
          node tools/fill-stars.mjs index.json metrics.json metrics-stars.json
          mv metrics-stars.json metrics.json

      # 补 npm 下载量（批量接口不支持 scoped 包，只能逐个查）
      - name: Backfill npm downloads
        continue-on-error: true
        run: |
          node tools/fill-downloads.mjs index.json metrics.json metrics-dl.json
          mv metrics-dl.json metrics.json

      - name: Rebuild with metrics
        run: node build-index.mjs --from-cache

      - name: Validate against the official checker
        run: node tools/check.mjs index.json

      - name: Privacy audit
        run: node tools/audit.mjs index.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json metrics.json
          if git diff --staged --quiet; then
            echo "索引没有变化"
          else
            git commit -m "Refresh index $(date -u +%Y-%m-%d)"
            git push
          fi
